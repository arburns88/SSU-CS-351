<!DOCTYPE html>
<html>

<head>
    <script src="initShaders.js"></script>

    <script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
        uniform float N;

        void main() {
            if (gl_VertexID == 0) {
                gl_Position = vec4(0.0, 0.0, 0.0, 1.0);
                return; 
            }

            float radius = (gl_VertexID % 2 != 0) ? 1.0 : 0.4;

            float angle = radians(270.0) - (2.0 * 3.14159265 / 10.0) * float(gl_VertexID);                   
            gl_Position = vec4(radius * cos(angle), radius * sin(angle), 0.0, 1.0);
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
        precision mediump float;
        out vec4 fColor;

        void main() {
            fColor = vec4(1.0, 1.0, 0.0, 1.0);
        }
    </script>

    <script>
        window.onload = () => {
            var canvas = document.getElementById("webgl");
            var gl = canvas.getContext("webgl2");

            gl.clearColor(0.1, 0.1, 0.1, 1.0);

            var program = initShaders(gl, "vertex-shader", "fragment-shader");

            var uN = gl.getUniformLocation(program, "N");
            //var uTime = gl.getUniformLocation(program, "t");

            var t = 0.0;

            var render = () => {
                t += 0.01;

                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.useProgram(program);

                // FIX: Set N to 12. 
                // 1 center + 10 points + 1 final point that loops back to close the shape
                const N = 12;

                gl.uniform1f(uN, N);
                //gl.uniform1f(uTime, t);
                gl.drawArrays(gl.TRIANGLE_FAN, 0, N);

                requestAnimationFrame(render);
            };

            render();
        };
    </script>
</head>

<body>
    <canvas id="webgl" width="512" height="512"></canvas>
</body>

</html>
